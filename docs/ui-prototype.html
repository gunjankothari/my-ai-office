<title>Agent Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
/* Layout: projects and offices on the left, the office floor in the middle, the selected agent on the right. Rooms are soft floor plates; people are flat illustrations with a status ring and a level badge. */
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --panel2:#F4F7F9; --floor:#E9EFF3; --floor2:#D5DFE6;
  --ink:#0F1B24; --muted:#55646E; --line:#DDE4EA;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --warn:#B8470C; --warn-ink:#FFFFFF; --ok:#1B7F3F; --bad:#B42318;
  --desk:#E9D8BC; --desk-edge:#CDB68F; --screen:#1D2A33;
  --r1:#2F6FDB; --r2:#D9480F; --r3:#0B7A63; --r4:#8E3FB5; --r5:#C99700; --r6:#D6336C;
  --font-display:'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body:'Figtree', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1317; --panel:#131C21; --panel2:#18232A; --floor:#172229; --floor2:#233239;
  --ink:#E6EEF2; --muted:#9BAEB8; --line:#25343D;
  --accent:#3DD6B0; --accent-ink:#09130F; --warn:#FB923C; --warn-ink:#1A0F05; --ok:#4ADE80; --bad:#F87171;
  --desk:#6E5C41; --desk-edge:#54452F; --screen:#091013;
  --r1:#5B9BFF; --r2:#FF8A4C; --r3:#3DD6B0; --r4:#C07AE6; --r5:#F2C230; --r6:#FF6F9F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1317; --panel:#131C21; --panel2:#18232A; --floor:#172229; --floor2:#233239;
  --ink:#E6EEF2; --muted:#9BAEB8; --line:#25343D;
  --accent:#3DD6B0; --accent-ink:#09130F; --warn:#FB923C; --warn-ink:#1A0F05; --ok:#4ADE80; --bad:#F87171;
  --desk:#6E5C41; --desk-edge:#54452F; --screen:#091013;
  --r1:#5B9BFF; --r2:#FF8A4C; --r3:#3DD6B0; --r4:#C07AE6; --r5:#F2C230; --r6:#FF6F9F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.muted{color:var(--muted)}
.mono,.num{font-variant-numeric:tabular-nums}
.hnd{font:500 14px var(--font-mono)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr) 380px;gap:20px;max-width:1560px;margin:0 auto;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(15,27,36,.05)}

/* sidebar */
.side{padding:18px 14px;display:flex;flex-direction:column;gap:22px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--font-display);letter-spacing:-.01em;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.sec-label{font-size:13px;font-weight:600;color:var(--muted);margin:0 8px 6px}
.side-list{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:10px;text-align:left;font-weight:500}
.nav-btn svg{flex:none;color:var(--muted)}
.nav-btn:hover{background:var(--panel2)}
.nav-btn[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--panel));font-weight:600}
.nav-btn[aria-current="true"] svg{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cnt{margin-left:auto;color:var(--muted);font-size:13.5px}
.badge{margin-left:auto;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--warn);color:var(--warn-ink);font-weight:700;font-size:12.5px}
.cnt+.badge{margin-left:6px}
.side-foot{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding:14px 8px 0}
.side-foot span{display:flex;gap:8px;align-items:center}
.led{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.led.off{background:var(--muted)}
.nav-btn .led{box-shadow:0 0 0 2px var(--panel)}

/* header */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;margin-bottom:18px}
h1{font:800 30px/1.15 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
.meters{display:flex;gap:20px;flex-wrap:wrap}
.meter{min-width:180px}
.meter .row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;color:var(--muted);margin-bottom:6px;gap:8px}
.meter .row span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:block;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}
.tag{font-size:12.5px;font-weight:600;background:var(--panel2);color:var(--muted);border-radius:6px;padding:2px 8px}
.hire-btn,.ok-btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:10px;font-weight:600}
.hire-btn:hover,.ok-btn:hover{filter:brightness(1.07)}
.ghost{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500}
.ghost:hover{background:var(--panel2)}
.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

/* office floor */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.zone,.room{border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.zone{background-color:var(--floor);background-image:radial-gradient(var(--floor2) 1.2px,transparent 1.5px);background-size:20px 20px}
.room{background:var(--panel);display:flex;flex-direction:column;gap:10px}
.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:700 17px var(--font-display)}
.zone-head svg{color:var(--accent)}
.zone-head .pill{font:600 13px var(--font-body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 9px}
.zone-head .plant{margin-left:auto}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.desk{display:flex;flex-direction:column;align-items:center;padding:14px 8px 12px;border:1.5px solid transparent;border-radius:16px;background:transparent;min-width:0;text-align:center}
.desk:hover{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.desk[aria-pressed="true"]{background:var(--panel);border-color:var(--accent);box-shadow:0 6px 18px rgba(15,27,36,.10)}
.desk.working{--ring:var(--ok)}
.desk.waiting{--ring:var(--warn)}
.desk.idle,.desk.sleeping{--ring:color-mix(in srgb,var(--muted) 40%,var(--panel))}
.av-wrap{position:relative;display:block;width:76px;height:76px}
.avatar{display:grid;place-items:end center;width:76px;height:76px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--role) 16%,var(--panel));box-shadow:0 0 0 3px var(--ring)}
.working .avatar{animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 3px var(--ring),0 0 0 3px color-mix(in srgb,var(--ring) 55%,transparent)}100%{box-shadow:0 0 0 3px var(--ring),0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.working .avatar{animation:none}}
.sleeping .avatar{filter:grayscale(.8);opacity:.6}
.lv{position:absolute;right:-6px;bottom:-2px;min-width:27px;height:27px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font:700 12.5px/23px var(--font-body);text-align:center;border:2px solid var(--panel)}
.dsk{position:relative;display:block;width:100%;max-width:118px;height:36px;margin-top:-16px}
.dsk i{display:block;position:absolute}
.mon{left:50%;top:0;transform:translateX(-50%);width:46px;height:28px;background:var(--screen);border-radius:6px;border:2px solid var(--desk-edge)}
.wood{left:0;right:0;bottom:0;height:12px;background:var(--desk);border:1px solid var(--desk-edge);border-radius:6px}
.mon.working{background:linear-gradient(var(--ok) 0 0) 6px 6px/20px 3px no-repeat,linear-gradient(var(--ok) 0 0) 6px 12px/30px 3px no-repeat,var(--screen)}
.mon.waiting{background:linear-gradient(var(--warn) 0 0) 6px 6px/30px 3px no-repeat,linear-gradient(var(--warn) 0 0) 6px 12px/16px 3px no-repeat,var(--screen)}
.mon.idle{background:linear-gradient(var(--muted) 0 0) 6px 10px/18px 3px no-repeat,var(--screen)}
.nm{font:700 16px/1.2 var(--font-display);margin-top:8px}
.rl{font-size:13.5px;color:var(--muted)}
.bar.mini{width:72%;height:6px;margin-top:10px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.rm-title{font:700 17px var(--font-display)}
.rm-stat{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--muted)}
.rm-stat b{color:var(--ink);font-weight:600}
.h2{font:700 19px var(--font-display);margin:28px 0 6px}
.feed li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.feed .t,.feed .k{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.feed .k{text-align:right}

/* chips */
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap;background:var(--chip-bg,var(--panel2));color:var(--chip-fg,var(--muted))}
.chip.working{--chip-fg:var(--ok);--chip-bg:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.chip.waiting{--chip-fg:var(--warn);--chip-bg:color-mix(in srgb,var(--warn) 14%,var(--panel))}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[aria-selected="true"]{background:var(--panel2)}
.link{background:none;border:0;padding:0;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* inbox */
.cards{display:flex;flex-direction:column;gap:12px}
.appr{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px}
.appr h3{font:700 17px/1.3 var(--font-display)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:32px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}

/* inspector */
.insp{padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.who{display:flex;gap:14px;align-items:center}
.who .face{width:72px;height:72px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--role,var(--accent)) 16%,var(--panel));display:grid;place-items:end center;flex:none}
.who h2{font:800 26px/1.1 var(--font-display);letter-spacing:-.01em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--panel)}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:500}
.stat .val{font:700 20px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl2{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-width:0}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list small{display:block;color:var(--muted);font-size:13.5px}
.note{font-size:13.5px;color:var(--muted);background:var(--panel2);border-radius:12px;padding:10px 12px}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap}
.no li::before{content:"\00D7";color:var(--bad);font-weight:700}

/* offices */
.banner{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--panel));padding:12px 14px;border-radius:14px;margin-bottom:16px}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ocard{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ocard.off{background:var(--panel2)}
.achip{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0;white-space:nowrap}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;max-width:320px}

/* connectors */
.cx-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cx-bar input{flex:1 1 220px;max-width:300px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pillbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-weight:500;font-size:14px}
.pillbtn:hover{background:var(--panel2)}
.pillbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard>p{font-size:14.5px;color:var(--muted)}
.ccard .btns{margin-top:auto;padding-top:4px}
.chead{display:flex;gap:12px;align-items:center}
.ctile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font:800 18px var(--font-display);color:var(--ink);background:color-mix(in srgb,var(--tile) 18%,var(--panel));box-shadow:inset 0 0 0 2px var(--tile)}
.cmeta{font-size:13.5px;color:var(--muted)}
.risk{display:inline-block;font-size:12.5px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.risk.read{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.risk.write{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.risk.destructive{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.tool{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.tool input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tool .grow{flex:1;min-width:0}

/* tickets */
.tkid{font:600 13px var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tkid.big{font-size:15px;color:var(--ink)}
.chip.done{--chip-fg:var(--accent);--chip-bg:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.tk-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tk-bar input[type=text]{flex:1 1 260px;max-width:440px}
.tk-bar label.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.tk-bar input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font:700 15px var(--font-display);display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h3 span{font:600 13px var(--font-body);color:var(--muted)}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;min-width:0;width:100%}
.tcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 14px rgba(15,27,36,.10)}
.tc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tc-title{font-weight:600;line-height:1.3}
.tc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.tc-sub{font-size:13px;color:var(--muted)}
.avs{display:flex;min-height:26px}
.mav{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:end center;background:color-mix(in srgb,var(--role) 18%,var(--panel));border:2px solid var(--panel);margin-left:-6px;flex:none}
.mav:first-child{margin-left:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{color:var(--muted);font-size:13px}
.who-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.who-row:last-child{border-bottom:0}
.who-row .grow{flex:1;min-width:0}
.who-row .bar{height:6px;margin-top:4px}
.sub-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 0;border-bottom:1px solid var(--line)}
.sub-row:last-child{border-bottom:0}
.sub-row:hover{background:var(--panel2)}
.lbl-chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--panel2);color:var(--ink)}
.lbl-chip.urgent{background:color-mix(in srgb,var(--bad) 12%,var(--panel));color:var(--bad)}
.sec-h{font:700 16px var(--font-display);margin:8px 0 2px}

/* studio */
.studio{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:16px;align-items:start}
.sk-list{max-height:480px;overflow:auto;padding:8px}
.sk-list .nav-btn{padding:8px 10px}
textarea.code{font:400 13.5px/1.6 var(--font-mono);min-height:360px;resize:vertical}
.box{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:13px;font-weight:600;text-align:left;color:var(--muted);padding:6px 4px}
.cmp td{padding:8px 4px;border-top:1px solid var(--line)}
.cmp tr.best td{background:var(--panel2);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1180px){.app{grid-template-columns:230px minmax(0,1fr)}.insp{grid-column:1/-1}.studio{grid-template-columns:210px minmax(0,1fr)}.studio .box.tests{grid-column:1/-1}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side-list{flex-direction:row;flex-wrap:wrap}
  .nav-btn{width:auto}
  .side-foot{display:none}
  .studio{grid-template-columns:minmax(0,1fr)}
  .sk-list{max-height:200px}
  h1{font-size:26px}
}
</style>

<div class="app">
  <aside class="panel side" id="side" aria-label="Projects and views"></aside>
  <main id="main" style="min-width:0"></main>

}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},2600);}
function log(a,x,k){feed.unshift({t:hhmm(),pr:a?a.project:S.project,a:a?a.id:null,x,k:k||''});}

const MUT=['approve','deny','pause','resume','fireDo','hire','publish','authorize','grantDo','revoke','rmDo','reauth','tkAccept','tkReopen','triageSend'];
function offBlock(oid){const o=officeById(oid||officeOf({project:S.project}));if(o.online)return false;toast(o.name+' is offline. Try again when it reconnects.');return true;}
function act(k,d){
  const a=byId(S.sel);
  if(MUT.includes(k)){const ap=(k==='approve'||k==='deny')?approvals.find(x=>x.id===d.id):null;if(offBlock(ap?officeOf(byId(ap.agent)):null))return;}
  if(k==='office'){clearPanels();S.office=d.id;S.project=projects.find(p=>p.id&&p.office===d.id).id;S.sel=null;S.hiring=false;S.fire=false;if(S.view==='offices'||S.view==='directory')S.view='office';render();}
  else if(k==='openProject'){clearPanels();const p=projects.find(x=>x.id===d.id);S.office=p.office;S.project=p.id;S.sel=null;S.view='office';render();}
  else if(k==='openAgent'){clearPanels();const ag=byId(d.id),p=projects.find(x=>x.id===ag.project);S.office=p.office;S.project=p.id;S.sel=ag.id;S.tab='overview';S.view='office';render();scrollInsp();}
  else if(k==='dirBy'){S.dirBy=d.id;renderMain();}
  else if(k==='project'){clearPanels();S.project=d.id;S.sel=null;S.hiring=false;S.fire=false;if(S.view==='offices'||S.view==='directory')S.view='office';render();}
  else if(k==='view'){clearPanels();S.view=d.id;render();}
  else if(k==='select'){clearPanels();S.sel=d.id;S.tab='overview';S.hiring=false;S.fire=false;render();scrollInsp();}
  else if(k==='tab'){S.tab=d.id;renderInsp();}
  else if(k==='hire'){clearPanels();S.hiring=true;S.hireRole='Developer';renderInsp();scrollInsp();}
  else if(k==='hireCancel'){S.hiring=false;renderInsp();}
  else if(k==='approve'||k==='deny'){
    const p=approvals.find(x=>x.id===d.id); if(!p)return; const ag=byId(p.agent);
    approvals=approvals.filter(x=>x.id!==d.id);
    if(k==='approve'){const tt=ag.ticket&&tickets.find(x=>x.id===ag.ticket);ag.status='working';ag.task=p.action;ag.progress=10;if(tt){tt.status='progress';tt.q='';ev(tt,null,'You approved: '+p.action+'.');if(tt.parent)refreshParent(tt.parent);}log(ag,'was approved to: '+p.action.toLowerCase(),'approved by you');toast('Approved. '+ag.name+' is on it.');}
    else{const tt=ag.ticket&&tickets.find(x=>x.id===ag.ticket);ag.status='idle';ag.task='';if(tt){tt.status='waiting';tt.q='You said no to: '+p.action+'. Reply with changes, or cancel.';ev(tt,null,'You denied: '+p.action+'.');ag.ticket=null;}log(ag,'was told no: '+p.action.toLowerCase(),'denied by you');toast('Denied. '+ag.name+' has been told.');}
    render();
  }
  else if(k==='pause'&&a){a.status='sleeping';a.note='Paused by you';a.task='';render();}
  else if(k==='resume'&&a){a.status='idle';a.note='';render();}
  else if(k==='fire'){S.fire=true;renderInsp();}
  else if(k==='fireNo'){S.fire=false;renderInsp();}
  else if(k==='fireDo'&&a){if(a.ticket){const ft=tickets.find(x=>x.id===a.ticket);if(ft){ft.status='new';ft.assignee=null;ev(ft,null,a.name+' left the company. This needs reassigning.');}}agents.splice(agents.indexOf(a),1);approvals=approvals.filter(p=>p.agent!==a.id);log(null,a.name+' left the company. Memory exported for you to keep.','');S.sel=null;S.fire=false;toast(a.name+' has left. Memory exported.');render();}
  else if(k==='grant'&&a){const mine=mineConns(a.project);S.grant={conn:mine[0]?mine[0].id:null,preset:'read',tools:mine[0]?presetTools(cby(mine[0].cid),'read'):[],res:'',exp:'never'};S.connect=S.manage=null;renderInsp();scrollInsp();}
  else if(k==='cat'){S.cat=d.id;const g=$('#cgrid');if(g){g.innerHTML=cgridHTML();document.querySelectorAll('.pillbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===S.cat)));}}
  else if(k==='connect'){S.connect=d.id;S.manage=null;S.grant=null;renderInsp();scrollInsp();}
  else if(k==='manage'){S.manage=d.id;S.connect=null;S.grant=null;S.mfire=false;renderInsp();scrollInsp();}
  else if(k==='closePanel'){clearPanels();renderInsp();}
  else if(k==='authorize'){const v=$('#cn-label').value.trim();if(!v){toast('Enter an account name first.');return;}const btn=$('#authBtn');btn.disabled=true;btn.textContent='Waiting for sign-in…';const cid=S.connect,proj=S.project;
    setTimeout(()=>{const id='c'+(++cseq);conns.push({id,project:proj,cid,label:v,since:'just now',st:'ok'});log(null,'connected '+cby(cid).name+' ('+v+') to this project','key stored in vault');S.connect=null;S.manage=id;toast(cby(cid).name+' connected as '+v+'.');render();},900);}
  else if(k==='reauth'){const m=conns.find(x=>x.id===S.manage);if(m){m.st='ok';toast('Signed in again.');render();}}
  else if(k==='rmAsk'){S.mfire=true;renderInsp();}
  else if(k==='rmNo'){S.mfire=false;renderInsp();}
  else if(k==='rmDo'){const m=conns.find(x=>x.id===S.manage);if(m){agents.forEach(ag=>{ag.access=ag.access.filter(x=>resolve(ag,x)!==m);});conns=conns.filter(x=>x!==m);log(null,'removed '+cby(m.cid).name+' ('+m.label+') from this project','key deleted');toast(cby(m.cid).name+' removed.');}S.manage=null;S.mfire=false;render();}
  else if(k==='grantDo'&&a){const g=S.grant,m=conns.find(x=>x.id===g.conn),c=cby(m.cid);if(!g.tools.length){toast('Pick at least one tool.');return;}a.access.push({cid:m.cid,c:m.id,s:sumText(g,c)});log(a,'was granted '+c.name+' ('+m.label+'): '+g.tools.length+' tools','by you');toast(a.name+' can now use '+c.name+'.');S.grant=null;S.tab='access';render();}
  else if(k==='revoke'&&a){const x=a.access.splice(+d.i,1)[0];log(a,'lost access to '+cby(x.cid).name,'revoked by you');toast('Access revoked.');render();}
  else if(k==='modelKey'){toast('Prototype: this project would get its own model key, kept in its own vault area.');}
  else if(k==='ticket'){clearPanels();S.ticket=d.id;renderMain();renderInsp();scrollInsp();}
  else if(k==='newTicket'){clearPanels();S.newTicket=true;renderInsp();scrollInsp();}
  else if(k==='tview'){S.tview=d.id;renderMain();}
  else if(k==='tkAccept'){const t=tickets.find(x=>x.id===S.ticket);if(t){t.status='done';t.q='';ev(t,null,'You accepted it as done.');log(null,'accepted '+t.id,'');toast(t.id+' marked done.');render();}}
  else if(k==='tkReopen'){const t=tickets.find(x=>x.id===S.ticket);if(t){t.status='planning';t.pt=0;t.q='';ev(t,null,'You reopened it.');toast(t.id+' reopened.');render();}}
  else if(k==='triageSend'){const x=triage.find(y=>y.id===d.id),mg=mgrOf(S.project);if(!x)return;if(!mg){toast('This project has no Manager. Hire one first.');return;}
    const id=newId(S.project);tickets.push(tk({id,project:S.project,title:x.sum.replace(/\.$/,'').slice(0,80),type:x.label==='bug'?'bug':x.label==='info'?'info':'task',src:x.via+', '+x.chan+' from '+x.from,status:'planning',assignee:mg.id,created:nowS(),updated:nowS(),budget:x.label==='info'?20000:60000,events:[{t:nowS(),a:null,x:'You sent a '+x.via+' message from '+x.from+' to '+mg.name+'.'}]}));
    triage=triage.filter(y=>y.id!==x.id);log(null,'sent a '+x.via+' message from '+x.from+' to '+mg.name+' as '+id,'');toast('Sent to '+mg.name+' as '+id+'.');render();}
  else if(k==='triageDismiss'||k==='triageSnooze'){triage=triage.filter(y=>y.id!==d.id);toast(k==='triageDismiss'?'Dismissed. The Communicator will learn from this.':'Snoozed until tomorrow.');render();}
  else if(k==='studioSkill'){S.skill=d.name;S.view='studio';S.tests=null;render();}
  else if(k==='runTests'){S.tests='running';$('#tests').innerHTML=testsHTML();setTimeout(()=>{S.tests=runTests();const t=$('#tests');if(t)t.innerHTML=testsHTML();},700);}
  else if(k==='publish'){toast('Published as the next version of "'+S.skill+'" (prototype).');}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset);});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(offBlock())return;
  if(f.dataset.form==='assign'){
    const a=byId(S.sel),v=$('#i-task').value.trim();if(!a||!v)return;
    if(a.status==='sleeping'){toast(a.name+' is asleep. Wake them first.');return;}
    if(a.status==='waiting'){toast(a.name+' is waiting for your OK on another task.');return;}
    a.task=v;a.status='working';a.progress=5;log(null,'assigned '+a.name+': '+v,'');toast('Assigned to '+a.name+'.');render();
  } else if(f.dataset.form==='newTicket'){
    const raw=$('#nt-text').value.trim();if(!raw)return;
    const isExt=/^[A-Za-z]+-\d+$/.test(raw);
    if(isExt){const ex=tickets.find(t=>t.project===S.project&&t.ext&&t.ext.toLowerCase()===raw.toLowerCase());if(ex){toast(ex.id+' already tracks '+ex.ext+'. Opening it.');clearPanels();S.ticket=ex.id;S.view='tickets';render();return;}}
    const to=byId($('#nt-to').value),id=newId(S.project),toMgr=to&&to.role==='Manager';
    const title=isExt?'Work on '+raw.toUpperCase():raw.split('\n')[0].slice(0,80);
    tickets.push(tk({id,project:S.project,title,type:$('#nt-type').value,src:isExt?'Jira':'You',ext:isExt?raw.toUpperCase():null,status:toMgr?'planning':'new',assignee:to?to.id:null,budget:+$('#nt-budget').value,created:nowS(),updated:nowS(),events:[{t:nowS(),a:null,x:'You sent this to '+(to?to.name:'the team')+'.'}]}));
    log(null,'created '+id+': '+title,'sent to '+(to?to.name:'the team'));clearPanels();S.ticket=id;toast(id+' created and sent to '+(to?to.name:'the team')+'.');render();
  } else if(f.dataset.form==='tkAnswer'){
    const t=tickets.find(x=>x.id===f.dataset.id),v=$('#tk-ans').value.trim();if(!t||!v)return;
    ev(t,null,v);t.q='';t.rounds++;const as=byId(t.assignee);
    if(as&&as.role==='Manager'){t.status='planning';t.pt=0;}else t.status='progress';
    toast('Sent.');render();
  } else if(f.dataset.form==='tkNote'){
    const t=tickets.find(x=>x.id===f.dataset.id),v=$('#tk-note').value.trim();if(!t||!v)return;
    ev(t,null,v);toast('Note added.');renderInsp();
  } else {
    const nm=$('#h-name').value.trim();if(!nm)return;
    const a=mk(nm,$('#h-role').value,S.project,{model:$('#h-model').value,level:1,xp:0,xpNext:200,tokens:0,cache:0,tpt:0});
    a.access=[];if(a.role==='Manager'||a.role==='Communicator')a.nobar=true;if(a.role==='Communicator'){a.listen=true;a.status='working';a.task='Listening';}agents.push(a);log(a,'joined as '+a.role+' with no access yet','');S.sel=a.id;S.tab='access';S.hiring=false;toast(nm+' hired. Grant access when ready.');render();
  }
});
document.addEventListener('change',e=>{
  const id=e.target.id,g=S.grant;
  if(id==='h-role'){S.hireRole=e.target.value;$('#h-prev').innerHTML=hirePrev(TPL[S.hireRole]);}
  else if(e.target.dataset&&e.target.dataset.set==='mode'){const a=byId(S.sel);if(a){a.mode=e.target.value;toast('Approval mode saved for '+a.name+'.');}}
  else if(id==='tk-subs'){S.subs=e.target.checked;const a=$('#tkarea');if(a)a.innerHTML=tkAreaHTML();}
  else if(g&&id==='g-conn'){g.conn=e.target.value;g.preset='read';g.tools=presetTools(cby(conns.find(x=>x.id===g.conn).cid),'read');renderInsp();}
  else if(g&&id==='g-preset'){g.preset=e.target.value;if(g.preset!=='custom')g.tools=presetTools(cby(conns.find(x=>x.id===g.conn).cid),g.preset);renderInsp();}
  else if(g&&id==='g-exp'){g.exp=e.target.value;grantSum();}
  else if(g&&e.target.dataset&&e.target.dataset.tool!==undefined){const c=cby(conns.find(x=>x.id===g.conn).cid),t=c.tools[+e.target.dataset.tool].n;g.tools=e.target.checked?g.tools.concat(t):g.tools.filter(x=>x!==t);g.preset='custom';$('#g-preset').value='custom';grantSum();}
});
function grantSum(){const g=S.grant,a=byId(S.sel),el=$('#g-sum');if(!g||!a||!el)return;el.textContent=a.name+' gets '+sumText(g,cby(conns.find(x=>x.id===g.conn).cid))+'. Destructive tools always ask you first.';}
document.addEventListener('input',e=>{
  if(e.target.id==='studio-text'){S.studio[S.skill]=e.target.value;const c=$('#ctx');if(c)c.innerHTML=ctxHTML();S.tests=null;const t=$('#tests');if(t)t.innerHTML=testsHTML();}
  else if(e.target.id==='tk-q'){S.tq=e.target.value;const g=$('#tkarea');if(g)g.innerHTML=tkAreaHTML();}
  else if(e.target.id==='cx-q'){S.q=e.target.value;const g=$('#cgrid');if(g)g.innerHTML=cgridHTML();}
  else if(e.target.id==='g-res'&&S.grant){S.grant.res=e.target.value;grantSum();}
});

/* ---------- live simulation ---------- */
setInterval(()=>{
  let changed=false;
  agents.filter(a=>a.role==='Manager').forEach(m=>{
    const pl=tickets.find(t=>t.project===m.project&&t.status==='planning');
    const task=pl?'Planning '+pl.id:'',st=pl?'working':'idle';
    if(m.status!==st||m.task!==task){m.status=st;m.task=task;m.ticket=pl?pl.id:null;changed=true;}
  });
  tickets.filter(t=>t.status==='planning'&&!isOff(officeOf({project:t.project}))).forEach(t=>{
    t.pt++;const mg=mgrOf(t.project);if(mg){mg.tokens+=150;t.contrib[mg.id]=(t.contrib[mg.id]||0)+150;}
    if(t.pt>=2)planTicket(t);changed=true;});
  tickets.filter(t=>t.status==='new'&&t.assignee).forEach(t=>{
    const a=byId(t.assignee);if(!a||isOff(officeOf(a))||a.status!=='idle'||a.ticket||a.listen)return;
    const af=t.after&&tickets.find(x=>x.id===t.after);if(af&&af.status!=='done')return;
    a.status='working';a.task=t.title;a.ticket=t.id;a.progress=0;t.status='progress';ev(t,a,'Started.');log(a,'started '+t.id,t.title);
    if(t.parent)refreshParent(t.parent);changed=true;});
  agents.forEach(a=>{
    if(a.status!=='working'||a.nobar||isOff(officeOf(a)))return;
    a.progress+=3+Math.floor(Math.random()*6);const tok=200+Math.floor(Math.random()*500);a.tokens+=tok;
    const t=a.ticket&&tickets.find(x=>x.id===a.ticket);if(t)t.contrib[a.id]=(t.contrib[a.id]||0)+tok;
    if(a.progress>=100){
      const gain=Math.round(25+Math.max(0,12000-a.tpt)/400);a.xp+=gain;a.status='idle';
      log(a,'finished: '+a.task,'+'+gain+' XP · '+kf(a.tokens)+' tokens today');
      if(a.xp>=a.xpNext){a.xp-=a.xpNext;a.level++;a.xpNext=Math.round(a.xpNext*1.2);log(a,'reached level '+a.level,'');toast(a.name+' reached level '+a.level+'.');}
      if(t){t.status='done';ev(t,a,'Finished.');if(t.parent)refreshParent(t.parent);else{t.status='waiting';t.q='Finished. Ready for your check.';toast(t.id+' is ready for you.');}}
      a.task='';a.progress=0;a.ticket=null;
    }
    changed=true;
  });
  if(!changed)return;
  const f=document.activeElement,fid=f&&f.closest?(f.closest('[data-agent]')||{dataset:{}}).dataset.agent:null;
  const typing=el=>f&&el.contains(f)&&/INPUT|TEXTAREA|SELECT/.test(f.tagName);
  renderSide();
  if(S.view!=='studio'&&!typing($('#main')))renderMain();
  if(!typing($('#insp')))renderInsp();
  if(fid){const n=document.querySelector('[data-agent="'+fid+'"]');if(n)n.focus({preventScroll:true});}
},3000);

render();
})();
</script>
